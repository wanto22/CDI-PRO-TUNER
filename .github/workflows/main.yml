name: NTECH PRO AUTO GENERATOR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Project and Fix Gradle
        run: |
          # 1. Membuat project Cordova
          cordova create ntech_app com.ntech.pro "NTECH_Pro"
          cd ntech_app
          
          # 2. Membuat folder www (wajib ada agar platform add tidak error)
          mkdir -p www
          echo "<html><body><h1>NTECH PRO READY</h1></body></html>" > www/index.html
          
          # 3. Menambahkan Platform Android 12
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-bluetooth-serial
          
          # 4. FIX: Menurunkan versi Gradle ke 8.7 menggunakan gradle sistem
          # Ini untuk mengatasi error 'XmlParser' pada Gradle 9.x
          cd platforms/android
          gradle wrapper --gradle-version 8.7

      - name: Build Android APK
        run: |
          cd ntech_app
          # Menggunakan flag --no-daemon untuk efisiensi resource di GitHub Actions
          cordova build android --debug -- --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTECH-PRO-APK
          path: ntech_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
