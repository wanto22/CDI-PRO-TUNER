name: NTECH PRO AUTO GENERATOR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Prepare Project
        run: |
          # 1. Membuat project Cordova
          cordova create ntech_app com.ntech.pro "NTECH_Pro"
          cd ntech_app
          
          # 2. Membuat folder www agar build tidak gagal
          mkdir -p www
          echo "<html><body>NTECH PRO READY</body></html>" > www/index.html
          
          # 3. Menambahkan Platform Android 12
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-bluetooth-serial

      - name: Force Gradle Downgrade
        # Langkah krusial untuk memperbaiki error XmlParser (Gambar 1000350720)
        run: |
          cd ntech_app/platforms/android
          # Menggunakan perintah wrapper manual untuk menurunkan ke versi 8.7
          # yang masih mendukung XmlParser
          gradle wrapper --gradle-version 8.7 --distribution-type all

      - name: Build Android APK
        run: |
          cd ntech_app
          # Menjalankan build menggunakan wrapper yang sudah diturunkan versinya
          cd platforms/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        # Menggunakan v4 untuk menghindari deprecation error (Gambar 1000350713)
        uses: actions/upload-artifact@v4
        with:
          name: NTECH-PRO-APK
          path: ntech_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
