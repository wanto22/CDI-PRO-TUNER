name: NTECH PRO AUTO GENERATOR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Generate Project Files
        run: |
          cordova create ntech_app com.ntech.pro "NTECH_Pro"
          cd ntech_app
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-bluetooth-serial
          
          # Membuat folder www agar tidak error saat build
          mkdir -p www
          echo "<html><body>NTECH PRO</body></html>" > www/index.html

      - name: Fix Gradle Version (Downgrade to 8.7)
        # Langkah ini untuk mengatasi error XmlParser pada Gradle 9.x
        run: |
          cd ntech_app/platforms/android
          ./gradlew wrapper --gradle-version 8.7

      - name: Build Android APK
        run: |
          cd ntech_app
          cordova build android --debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTECH-PRO-APK
          path: ntech_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
