<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>NTECH PRO TUNER</title>
    <style>
        :root { --bg: #0d0d0d; --card: #1a1a1a; --accent: #00ff88; --warn: #ffcc00; --text: #f0f0f0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: 80px; overflow-x: hidden;}
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-around; background: var(--card); position: fixed; bottom: 0; width: 100%; border-top: 1px solid #333; height: 70px; z-index: 1000; }
        .nav-item { padding: 10px; color: #666; font-size: 11px; text-align: center; flex: 1; display: flex; flex-direction: column; justify-content: center; font-weight: bold;}
        .nav-item.active { color: var(--accent); border-top: 3px solid var(--accent); background: #222; }

        /* Content */
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.2s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* UI Elements */
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #262626; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .big-val { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1.2; }
        .label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        
        /* Table Editor */
        .table-scroll { height: 380px; overflow-y: auto; border-radius: 8px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; background: #111; }
        th { position: sticky; top: 0; background: #222; padding: 10px; font-size: 12px; color: var(--accent); }
        td { border: 1px solid #222; padding: 5px; text-align: center; }
        
        /* Inputs & Buttons */
        input { width: 85%; background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold;}
        button { background: #2979ff; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 14px; margin-top: 5px; }
        button:active { filter: brightness(1.3); transform: scale(0.98); }
        .btn-save { background: var(--accent); color: #000; }
        .btn-fetch { background: var(--warn); color: #000; margin-bottom: 10px; }
        select { width: 100%; padding: 12px; background: #222; color: white; border: 1px solid #444; border-radius: 10px; margin-bottom: 15px; font-weight: bold;}
    </style>
</head>
<body>

    <div id="tab-monitor" class="tab-content active">
        <h3 style="text-align:center; margin-top:0">LIVE TELEMETRY</h3>
        <div class="card">
            <button id="btnConn" onclick="connectBT()">HUBUNGKAN BLUETOOTH</button>
        </div>
        <div class="grid">
            <div class="card"><div class="label">Engine RPM</div><div id="valRPM" class="big-val">0</div></div>
            <div class="card"><div class="label">Timing Adv</div><div id="valAdv" class="big-val">0°</div></div>
            <div class="card"><div class="label">Edge Mode</div><div id="valEdge" class="big-val" style="font-size:20px">-</div></div>
            <div class="card"><div class="label">Rumble Status</div><div id="valRumble" class="big-val" style="font-size:20px">OFF</div></div>
        </div>
        <div class="card">
            <div class="label">Current Active Map</div>
            <div id="valActiveMapDisplay" style="font-size:18px; font-weight:bold; color:var(--warn)">Belum Tarik Data</div>
        </div>
    </div>

    <div id="tab-kurva" class="tab-content">
        <h3>MAP EDITOR (32 POINTS)</h3>
        <button class="btn-fetch" onclick="fetchData()">TARIK DATA EEPROM</button>
        <select id="mapSelector" onchange="renderMapTable()">
            <option value="1">MAP 1 (Standard)</option>
            <option value="2">MAP 2 (Racing)</option>
            <option value="3">MAP 3 (Extreme)</option>
        </select>
        <div class="table-scroll">
            <table>
                <thead><tr><th>#</th><th>RPM</th><th>Adv (°)</th></tr></thead>
                <tbody id="mapTableBody"></tbody>
            </table>
        </div>
        <button class="btn-save" onclick="saveAllMaps()">SIMPAN SEMUA MAP</button>
    </div>

    <div id="tab-setting" class="tab-content">
        <h3>SYSTEM SETTINGS</h3>
        <div class="card">
            <div class="grid">
                <div><label class="label">Limiter (RPM)</label><input type="number" id="setLim"></div>
                <div><label class="label">Pulser Ang (°)</label><input type="number" id="setAng"></div>
                <div><label class="label">SCR Pulse (us)</label><input type="number" id="setSCR"></div>
                <div><label class="label">Edge (0/1)</label><input type="number" id="setEdge" min="0" max="1"></div>
            </div>
        </div>
        <div class="card">
            <label class="label">Rumble Idle Activation RPM</label>
            <input type="number" id="setRblRPM" style="width:94%">
            <div style="margin-top:10px"></div>
            <label class="label">Rumble Intensity (Skip Fire)</label>
            <input type="number" id="setRblSkip" style="width:94%" placeholder="Nilai 2-8">
        </div>
        <button class="btn-save" onclick="saveSettings()">SIMPAN SETTING SISTEM</button>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="openTab(event, 'tab-monitor')">MONITOR</div>
        <div class="nav-item" onclick="openTab(event, 'tab-kurva')">KURVA</div>
        <div class="nav-item" onclick="openTab(event, 'tab-setting')">SETTING</div>
    </div>

    <script src="cordova.js"></script>
    <script>
        let maps = { 1: Array(32).fill(0), 2: Array(32).fill(0), 3: Array(32).fill(0) };
        let btConnected = false;

        function openTab(evt, tabName) {
            let contents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < contents.length; i++) contents[i].classList.remove("active");
            let navs = document.getElementsByClassName("nav-item");
            for (let i = 0; i < navs.length; i++) navs[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function connectBT() {
            bluetoothSerial.list(devices => {
                let hc = devices.find(d => d.name.includes("HC-05") || d.name.includes("BT"));
                if(hc) {
                    bluetoothSerial.connect(hc.address, () => {
                        btConnected = true;
                        document.getElementById('btnConn').innerText = "CONNECTED ✅";
                        document.getElementById('btnConn').style.background = "#004d40";
                        bluetoothSerial.subscribe('\n', data => parseData(data.trim()));
                    }, () => alert("Gagal Hubung!"));
                } else { alert("Pasangkan (Pair) HC-05 dulu di HP!"); }
            });
        }

        function parseData(data) {
            if(data.startsWith("RPM:")) document.getElementById('valRPM').innerText = data.split(":")[1];
            if(data.startsWith("LIM:")) document.getElementById('setLim').value = data.split(":")[1];
            if(data.startsWith("ANG:")) document.getElementById('setAng').value = data.split(":")[1];
            if(data.startsWith("SCR:")) document.getElementById('setSCR').value = data.split(":")[1];
            if(data.startsWith("EDG:")) {
                let e = data.split(":")[1];
                document.getElementById('setEdge').value = e;
                document.getElementById('valEdge').innerText = (e == "0" ? "FALLING" : "RISING");
            }
            if(data.startsWith("RBL:")) {
                let r = data.split(":")[1];
                document.getElementById('setRblRPM').value = r;
                document.getElementById('valRumble').innerText = (r == "0" ? "OFF" : "ON");
            }
            if(data.startsWith("RSK:")) document.getElementById('setRblSkip').value = data.split(":")[1];
            if(data.startsWith("ACT:")) document.getElementById('valActiveMapDisplay').innerText = "MAP " + data.split(":")[1];
            
            // Parsing Maps (Sangat Cepat)
            if(data.startsWith("M1:")) { maps[1] = data.substring(3).split(','); renderMapTable(); }
            if(data.startsWith("M2:")) { maps[2] = data.substring(3).split(','); }
            if(data.startsWith("M3:")) { maps[3] = data.substring(3).split(','); }
        }

        function renderMapTable() {
            let mId = document.getElementById('mapSelector').value;
            let html = "";
            for(let i=0; i<32; i++) {
                let labelRPM = (i == 0) ? "Idle" : (i * 500) + 500;
                html += `<tr><td>${i+1}</td><td>${labelRPM}</td><td><input type="number" value="${maps[mId][i]}" onchange="updateMap(${mId},${i},this.value)"></td></tr>`;
            }
            document.getElementById('mapTableBody').innerHTML = html;
        }

        function updateMap(mId, idx, val) { maps[mId][idx] = parseInt(val); }

        function fetchData() {
            if(!btConnected) return alert("Bluetooth belum terhubung!");
            bluetoothSerial.write("GET\n");
        }

        function saveAllMaps() {
            // Jeda 600ms antar pengiriman agar HC-05 tidak overload
            bluetoothSerial.write("M1:" + maps[1].join(',') + "\n");
            setTimeout(() => bluetoothSerial.write("M2:" + maps[2].join(',') + "\n"), 600);
            setTimeout(() => bluetoothSerial.write("M3:" + maps[3].join(',') + "\n"), 1200);
            setTimeout(() => { 
                bluetoothSerial.write("SAVE\n"); 
                alert("Semua data Map tersimpan di EEPROM!"); 
            }, 1800);
        }

        function saveSettings() {
            let cmds = [
                "LIM:" + document.getElementById('setLim').value,
                "ANG:" + document.getElementById('setAng').value,
                "SCR:" + document.getElementById('setSCR').value,
                "EDG:" + document.getElementById('setEdge').value,
                "RBL:" + document.getElementById('setRblRPM').value,
                "RSK:" + document.getElementById('setRblSkip').value,
                "SAVE"
            ];
            let i = 0;
            let timer = setInterval(() => {
                bluetoothSerial.write(cmds[i] + "\n");
                i++;
                if(i >= cmds.length) { clearInterval(timer); alert("Setting Sistem Berhasil Diupdate!"); }
            }, 250);
        }
    </script>
</body>
</html>
